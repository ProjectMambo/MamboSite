[workspace]
members = [
    "crates/mambosite-core",
    "crates/mambosite-codegen-ts",
    "crates/mambosite-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ProjectMambo/MamboSite"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
comrak = { version = "0.54", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "1.1", default-features = false, features = ["deserialize"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"
toml = "1.1"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
