name: Deploy MamboSite to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ProjectMambo/MamboSite
          path: .mambosite-compiler
          ref: v0.1.0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      # `mambosite init` is offline. Generate and commit this lockfile once
      # with `npm install` so CI installs the exact reviewed dependency graph.
      - name: Require npm lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Run npm install and commit package-lock.json before deploying." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install site dependencies
        run: npm ci
      - name: Build site
        run: cargo run --locked --quiet --manifest-path .mambosite-compiler/Cargo.toml --package mambosite-cli -- build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
